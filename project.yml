name: Pruva
options:
  bundleIdPrefix: com.pruva
  deploymentTarget:
    iOS: '17.0'
packages:
  RaceCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Pruva:
    type: application
    platform: iOS
    sources:
      - Pruva
    dependencies:
      - package: RaceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pruva.sailing
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pruva
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Pruva teknenizin Wi-Fi ağındaki NMEA cihazından GPS konumu, hız ve rüzgâr ölçümlerini almak için yerel ağa bağlanır.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Pruva yalnız sesli komut düğmesine bastığınızda Türkçe komutunuzu dinler.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Pruva sesli yarış bildirimlerinizi yazıya çevirmek ve karar desteği sunmak için konuşma tanıma kullanır.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PruvaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PruvaUITests]
    dependencies:
      - target: Pruva
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PruvaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PruvaTests]
    dependencies:
      - target: Pruva
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pruva:
    build:
      targets:
        Pruva: all
    test:
      targets: [PruvaTests, PruvaUITests]
